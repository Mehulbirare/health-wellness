<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E44AD" />
      <stop offset="100%" stop-color="#3498DB" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" />
      <stop offset="100%" stop-color="#F39C12" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#1ABC9C" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="48" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Vata (Air) - Purple/Blue -->
  <path d="M50 10 C 30 30, 30 70, 50 90" stroke="url(#gradient1)" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Pitta (Fire) - Red/Orange -->
  <path d="M50 10 C 70 30, 70 70, 50 90" stroke="url(#gradient2)" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Kapha (Earth) - Green -->
  <path d="M30 50 C 40 40, 60 40, 70 50" stroke="url(#gradient3)" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Center circle -->
  <circle cx="50" cy="50" r="10" fill="#fff" stroke="#ddd" stroke-width="1" />
  
  <!-- Lotus symbol in center -->
  <circle cx="50" cy="50" r="5" fill="#FFC107" />
</svg>